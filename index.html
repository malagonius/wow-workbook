<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WoW Workbook — Talent Trees</title>
  <style>
    :root { --gold:#f2c14e; --panel:#15191f; --panel2:#20252d; --line:#46505c; --text:#f3f4f6; --muted:#9da6b2; --blue:#4da3ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at top,#26303b 0,#101318 52%,#080a0d 100%); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { padding:28px 24px 20px; text-align:center; border-bottom:1px solid #303741; background:rgba(8,10,13,.82); }
    h1 { margin:0; font-size:clamp(28px,4vw,46px); letter-spacing:.04em; text-shadow:0 2px 10px #000; }
    header p { margin:8px 0 0; color:var(--muted); }
    .controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:18px 24px; position:sticky; top:0; z-index:10; background:rgba(10,12,16,.94); backdrop-filter:blur(10px); border-bottom:1px solid #303741; }
    label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.08em; }
    select { min-width:220px; padding:11px 38px 11px 12px; color:var(--text); background:var(--panel2); border:1px solid #505965; border-radius:6px; font-size:15px; }
    main { max-width:1400px; margin:0 auto; padding:26px 18px 60px; }
    .tree-header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    .tree-header h2 { margin:0; font-size:30px; }
    .tree-header .class-name { color:var(--gold); font-weight:700; }
    .tree-header p { margin:5px 0 0; color:var(--muted); }
    .tree-wrap { overflow:auto; padding:10px 8px 24px; }
    .tree { position:relative; min-width:920px; min-height:620px; padding:30px 30px 50px; background:linear-gradient(180deg,rgba(31,36,44,.97),rgba(15,18,23,.97)); border:1px solid #414a55; border-radius:10px; box-shadow:0 16px 50px rgba(0,0,0,.35); }
    .tier { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:26px; min-height:135px; }
    .tier + .tier { margin-top:18px; }
    .tier-label { position:absolute; left:-6px; top:-18px; color:#68727e; font-size:11px; font-weight:700; letter-spacing:.12em; }
    .node { position:relative; z-index:2; width:94px; height:94px; margin:auto; padding:7px; display:flex; align-items:center; justify-content:center; text-align:center; color:#e9edf2; background:linear-gradient(145deg,#323a44,#171b21); border:3px solid #69737f; border-radius:10px; box-shadow:0 4px 12px #000b; cursor:default; transition:.15s; }
    .node:hover { transform:translateY(-2px); border-color:var(--gold); box-shadow:0 7px 20px #000c,0 0 14px #f2c14e33; }
    .node.empty { opacity:.25; border-style:dashed; }
    .node.rune { border-color:#54b8ff; }
    .node.rp { border-color:#b65cff; }
    .node.utility { border-color:#e0b44f; }
    .node strong { display:block; font-size:12px; line-height:1.15; }
    .node small { display:block; margin-top:5px; color:#aeb7c2; font-size:9px; line-height:1.15; }
    .connector { position:absolute; z-index:1; width:calc(25% - 40px); height:2px; background:var(--line); top:50%; left:12.5%; box-shadow:0 0 5px #000; }
    .connector.c2 { left:37.5%; } .connector.c3 { left:62.5%; }
    .vertical { position:absolute; z-index:1; width:2px; height:48px; background:var(--line); left:50%; bottom:-33px; }
    .empty-state { min-height:620px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:1px dashed #48515d; border-radius:10px; color:var(--muted); background:rgba(20,24,30,.7); }
    .empty-state .icon { font-size:54px; opacity:.55; margin-bottom:10px; }
    .legend { display:flex; flex-wrap:wrap; gap:16px; margin:18px 4px 0; color:var(--muted); font-size:12px; }
    .legend span::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; border-radius:3px; border:2px solid; vertical-align:-1px; }
    .legend .rune::before { border-color:#54b8ff; } .legend .rp::before { border-color:#b65cff; } .legend .utility::before { border-color:#e0b44f; }
    .details { margin-top:18px; padding:18px; background:rgba(21,25,31,.9); border:1px solid #343d47; border-radius:8px; }
    .details h3 { margin:0 0 8px; } .details p { margin:0; color:var(--muted); line-height:1.5; }
    @media (max-width:700px) { .controls { justify-content:stretch; } label { flex:1 1 100%; } select { width:100%; } .tree-header { display:block; } }
  </style>
</head>
<body>
<header>
  <h1>WoW Workbook</h1>
  <p>Homebrew class &amp; specialization talent-tree viewer</p>
</header>
<section class="controls">
  <label>Class <select id="classSelect"></select></label>
  <label>Specialization <select id="specSelect"></select></label>
</section>
<main>
  <div class="tree-header">
    <div><div class="class-name" id="className"></div><h2 id="specName"></h2><p id="specDescription"></p></div>
  </div>
  <div id="treeContainer"></div>
  <div class="legend"><span class="rune">Rune / resource talent</span><span class="rp">Runic Power / major spender</span><span class="utility">Utility / passive</span></div>
  <div class="details" id="details"></div>
</main>
<script>
  const classes = {
    "Death Knight": ["Blood", "Frost", "Unholy", "Lichborn"],
    "Demon Hunter": ["Havoc", "Vengeance", "Devourer"],
    "Druid": ["Balance", "Feral", "Guardian", "Restoration"],
    "Evoker": ["Devastation", "Preservation", "Augmentation"],
    "Hunter": ["Beast Mastery", "Marksmanship", "Survival"],
    "Mage": ["Arcane", "Fire", "Frost"],
    "Monk": ["Brewmaster", "Mistweaver", "Windwalker"],
    "Paladin": ["Holy", "Protection", "Retribution"],
    "Priest": ["Discipline", "Holy", "Shadow"],
    "Rogue": ["Assassination", "Outlaw", "Subtlety"],
    "Shaman": ["Elemental", "Enhancement", "Restoration"],
    "Warlock": ["Affliction", "Demonology", "Destruction"],
    "Warrior": ["Arms", "Fury", "Protection"]
  };

  // Homebrew data is intentionally kept separate from the UI so new workbook specs can be added here later.
  const trees = {
    "Death Knight/Lichborn": {
      description: "Fourth Death Knight specialization — dominion, inevitability, and the progressive loss of enemy agency.",
      nodes: [
        {tier:1, col:2, name:"Dominate", type:"rune", meta:"1 Rune • Melee", desc:"Minor damage. Applies Death's Claim."},
        {tier:1, col:3, name:"Death's Grasp", type:"rune", meta:"2 Runes • 30 yd", desc:"Minor damage. Applies Death's Claim."},
        {tier:2, col:1, name:"Consume Fear", type:"rune", meta:"3 Runes • 15 yd", desc:"Minor damage. Generates Runic Power based on target count."},
        {tier:2, col:4, name:"Remorseless Strike", type:"rune", meta:"3 Runes • Melee", desc:"Heavy single-target damage with moderate splash damage."},
        {tier:3, col:2, name:"Impending Doom", type:"rp", meta:"Runic Power • TBD", desc:"Exploits Death's Claim by applying the Impending Doom effect."},
        {tier:3, col:3, name:"Death's Presence", type:"rp", meta:"Runic Power • 30 yd", desc:"Applies Impending Doom to all targets in range at a higher cost."},
        {tier:4, col:1, name:"Dominate Mind", type:"rp", meta:"Runic Power • Melee", desc:"The target reflects damage it deals back to itself; threshold scales with Death's Claim."},
        {tier:4, col:4, name:"Betrayal", type:"utility", meta:"Runic Power • TBD", desc:"Reduces target damage dealt, scaling with Death's Claim."}
      ],
      details: "Core loop: spend Runes → build Death's Claim → generate Runic Power → spend Runic Power to exploit Death's Claim. The tree is driven directly from the current Lichborn spellbook and remains intentionally editable while the design is in flux."
    }
  };

  const classSelect = document.getElementById('classSelect');
  const specSelect = document.getElementById('specSelect');
  const className = document.getElementById('className');
  const specName = document.getElementById('specName');
  const description = document.getElementById('specDescription');
  const container = document.getElementById('treeContainer');
  const details = document.getElementById('details');

  Object.keys(classes).forEach(c => classSelect.add(new Option(c,c)));
  classSelect.value = 'Death Knight';

  function populateSpecs() {
    specSelect.innerHTML = '';
    classes[classSelect.value].forEach(s => specSelect.add(new Option(s,s)));
    if (classSelect.value === 'Death Knight') specSelect.value = 'Lichborn';
    render();
  }

  function render() {
    const key = `${classSelect.value}/${specSelect.value}`;
    const data = trees[key];
    className.textContent = classSelect.value;
    specName.textContent = specSelect.value;
    description.textContent = data?.description || 'No homebrew talent tree has been defined for this specialization yet.';
    details.innerHTML = `<h3>${data ? 'Tree notes' : 'Ready for design'}</h3><p>${data?.details || 'This viewer is data-driven: add a specialization entry and its nodes to the <code>trees</code> object in index.html to populate the tree without changing the UI.'}</p>`;

    if (!data) {
      container.innerHTML = `<div class="empty-state"><div class="icon">✦</div><strong>No custom tree yet</strong><span>Use this slot for future homebrew specialization work.</span></div>`;
      return;
    }

    const tiers = [1,2,3,4];
    container.innerHTML = `<div class="tree">${tiers.map(tier => {
      const nodes = data.nodes.filter(n => n.tier === tier);
      return `<div class="tier"><span class="tier-label">TIER ${tier}</span>${[1,2,3,4].map(col => {
        const n = nodes.find(x => x.col === col);
        return n ? `<div class="node ${n.type}" title="${n.desc}"><div><strong>${n.name}</strong><small>${n.meta}</small></div></div>` : `<div></div>`;
      }).join('')}${tier < 4 ? '<span class="vertical"></span>' : ''}</div>`;
    }).join('')}</div>`;
  }

  classSelect.addEventListener('change', populateSpecs);
  specSelect.addEventListener('change', render);
  populateSpecs();
</script>
</body>
</html>
