<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WoW Workbook — Talent Designer</title>
  <link rel="stylesheet" href="css/talent-calculator.css">
  <link rel="stylesheet" href="css/talent-tree.css">
  <link rel="stylesheet" href="css/talent-designer.css">
  <link rel="stylesheet" href="css/app-navigation.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="designer-page">
  <div id="app-header"></div>

  <main class="designer" id="main-content">
    <header class="designer-header">
      <div>
        <h1>Talent Designer</h1>
      </div>
    </header>

    <section class="designer-toolbar">
      <label>Class
        <select id="designer-class"></select>
      </label>
      <label>Spec
        <select id="designer-spec"></select>
      </label>
      <label>Section
        <select id="designer-section"></select>
      </label>
      <button id="add-node" type="button">＋ Talent</button>
      <button id="undo" type="button" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redo" type="button" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      <button id="save-project" type="button" title="Save this class to a JSON file on your device">Save class</button>
      <details class="designer-tools">
        <summary>Tools</summary>
        <div class="designer-tools-actions">
      <button id="add-class" type="button">＋ Class</button>
      <button id="add-spec" type="button">＋ Spec</button>
      <button id="add-ability" type="button">＋ Ability</button>
      <button id="clear-section" type="button">Clear section</button>
      <button id="show-json" type="button">&lt;&gt; JSON</button>
      <button id="export-project" type="button" title="Export all class data in one JSON file, ready to replace its file in config/class/">Export class</button>
      <button id="import-project" type="button" title="Update imported classes without removing other classes">Import classes</button>
      <button id="reset-draft" type="button">Reset draft</button>
        </div>
      </details>
      <input id="project-file" type="file" accept="application/json,.json" hidden>
    </section>
    <p id="storage-status" class="storage-status" role="status">Loading local draft…</p>
    <section class="designer-workspace">
      <div class="designer-canvas">
        <div class="canvas-toolbar">
          <div class="canvas-segments" role="group" aria-label="Canvas view">
            <button id="view-list" type="button" aria-pressed="false">List</button>
            <button id="view-tree" type="button" aria-pressed="true">Tree</button>
          </div>
          <div class="canvas-segments" role="group" aria-label="Talent action">
            <button id="mode-select" type="button" aria-pressed="true">Edit</button>
            <button id="mode-connect" type="button" aria-pressed="false">Connect</button>
          </div>
          <p id="canvas-status" role="status">No talent selected</p>
          <button id="edit-selected" type="button" disabled>Edit talent</button>
        </div>
        <div id="designer-tree" class="designer-tree" role="region" aria-label="Talent design canvas" tabindex="0"></div>
      </div>

      <dialog id="node-dialog" class="designer-modal" aria-labelledby="node-dialog-title">
        <header class="modal-header"><h2 id="node-dialog-title">Edit talent</h2><button type="button" class="modal-close" id="node-dialog-close" aria-label="Close talent editor">×</button></header>
        <div class="modal-body designer-panel">
        <p id="selection-hint">Select a talent to edit it.</p>
        <form id="node-form" hidden autocomplete="off">
          <label>Name<input id="node-name"></label>
          <label>Description<textarea id="node-description" rows="4"></textarea></label>
          <label>Icon
            <span class="icon-field">
              <input id="node-icon" placeholder="icons/frost-strike.png or ❄">
              <span id="node-icon-preview" class="icon-preview" aria-hidden="true"></span>
            </span>
          </label>
          <div class="designer-grid-fields">
            <label>Kind<select id="node-kind"></select></label>
            <label>Max rank<input id="node-max-rank" type="number" min="1" max="20"></label>
          </div>
          <fieldset id="active-spell-fields">
            <legend>Spell details</legend>
            <div class="designer-grid-fields">
              <label>Cost<input id="node-cost" placeholder="30 Runic Power"></label>
              <label>Range<input id="node-range" placeholder="40 yd"></label>
            </div>
            <div class="designer-grid-fields">
              <label>Charges<input id="node-charges" placeholder="1 Charge"></label>
              <label>Cast time<input id="node-cast-time" placeholder="Instant"></label>
            </div>
            <label>Cooldown<input id="node-cooldown" placeholder="6 sec cooldown"></label>
          </fieldset>
          <div class="designer-grid-fields">
            <label>Row<input id="node-row" type="number" min="0"></label>
            <label>Column<input id="node-column" type="number" min="0"></label>
          </div>

          <fieldset id="choice-fields" hidden>
            <legend>Choice options</legend>
            <label>Option A name<input id="choice-a-name"></label>
            <label>Option A description<textarea id="choice-a-description" rows="2"></textarea></label>
            <label>Option B name<input id="choice-b-name"></label>
            <label>Option B description<textarea id="choice-b-description" rows="2"></textarea></label>
          </fieldset>

          <details class="advanced">
            <summary>Advanced</summary>
            <label>Node ID<input id="node-id"></label>
          </details>

          <div class="designer-actions">
            <button type="button" id="duplicate-node">Duplicate</button>
            <button type="button" id="clear-node">Clear</button>
            <button type="button" id="delete-node">Delete</button>
          </div>
        </form>
        </div>
      </dialog>

      <aside class="designer-panel">
        <details class="panel-group">
          <summary>Section settings</summary>
          <div class="panel-form">
            <label>Title<input id="section-title"></label>
            <div class="designer-grid-fields">
              <label>Type<select id="section-type"></select></label>
              <label>Max points<input id="section-max-points" type="number" min="0"></label>
            </div>
            <div class="designer-grid-fields">
              <label>Columns<input id="section-columns" type="number" min="1" max="12"></label>
              <label>Rows<input id="section-rows" type="number" min="1" max="30"></label>
            </div>
            <label class="checkbox"><input id="section-selectable" type="checkbox"> Empty sockets are selectable</label>
            <div class="designer-actions">
              <button type="button" id="add-section">Add section</button>
              <button type="button" id="delete-section">Delete section</button>
            </div>
          </div>
        </details>

        <details class="panel-group">
          <summary>Tree settings</summary>
          <div class="panel-form">
            <label>Specialization description<textarea id="tree-description" rows="3"></textarea></label>
            <div class="designer-actions">
              <button type="button" id="rename-spec">Rename spec</button>
              <button type="button" id="duplicate-spec">Duplicate spec</button>
              <button type="button" id="delete-spec">Delete spec</button>
            </div>
            <div class="designer-actions">
              <button type="button" id="rename-class">Rename class</button>
              <button type="button" id="delete-class">Delete class</button>
            </div>
          </div>
        </details>

        <details class="panel-group" open>
          <summary>Abilities</summary>
          <div class="panel-form">
            <div id="designer-abilities-list"></div>
            <div class="designer-actions">
              <button type="button" id="create-ability">＋ Create Ability</button>
            </div>
          </div>
        </details>

        <details class="panel-group" open>
          <summary>Connections</summary>
          <div id="connection-list" class="connection-list"></div>
        </details>

        <div id="validation-panel" class="validation-panel"></div>
      </aside>
    </section>
  </main>

  <dialog id="content-dialog" class="designer-modal" aria-labelledby="content-dialog-title">
    <form method="dialog" class="json-dialog-content" id="content-form">
      <header class="modal-header"><h2 id="content-dialog-title">Create</h2><button type="button" class="modal-close" id="content-dialog-close" aria-label="Close">×</button></header>
      <div class="modal-body">
        <p id="content-dialog-help"></p>
        <label>Name<input id="content-name" required autocomplete="off"></label>
        <label id="content-description-label">Description<textarea id="content-description" rows="3"></textarea></label>
        <div class="modal-footer">
          <button type="button" id="create-content" class="primary">Create</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="json-dialog" class="designer-modal" aria-labelledby="json-dialog-title">
    <form method="dialog" class="json-dialog-content">
      <header class="modal-header"><h2 id="json-dialog-title">Current class JSON</h2><button type="button" class="modal-close" id="json-dialog-close" aria-label="Close">×</button></header>
      <div class="modal-body">
        <textarea id="json-output" aria-label="Current class JSON" spellcheck="false"></textarea>
        <div class="modal-footer">
          <button type="button" id="apply-json" class="primary">Apply JSON</button>
          <button type="button" id="copy-json">Copy JSON</button>
        </div>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app-navigation.js"></script>
  <script type="module" src="js/talent-designer.js"></script>
</body>
</html>
