<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoW Workbook — Talent Calculator</title>
<link rel="stylesheet" href="css/talent-calculator.css">
</head>
<body>
<header>
  <h1>WoW Workbook</h1>
  <p>Homebrew class &amp; specialization talent calculator</p>
</header>

<section class="controls">
  <label class="control">Class <select id="classSelect"></select></label>
  <label class="control">Specialization <select id="specSelect"></select></label>
  <div class="toolbar">
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn primary" id="spellsBtn">View Spells</button>
  </div>
</section>

<main>
  <div class="tree-header">
    <div>
      <div class="class-name" id="className"></div>
      <h2 id="specName"></h2>
      <p id="specDescription"></p>
    </div>
    <div class="points">
      <strong id="pointCount">0 / 0</strong>
      <span>Talent points</span>
    </div>
  </div>

  <div class="tree-wrap" id="treeContainer"></div>

  <div class="legend">
    <span class="rune">Rune / resource</span>
    <span class="rp">Runic Power / spender</span>
    <span class="utility">Utility / passive</span>
  </div>

  <div class="details" id="details"></div>
</main>

<div class="modal" id="spellModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">Spellbook</h3>
      <button class="close" id="closeModal" aria-label="Close">×</button>
    </div>
    <div id="spellList"></div>
  </div>
</div>

<script src="js/talent-calculator.js"></script>
</body>
</html>
